name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6
      - name: Install system packages
        run: brew install libadwaita blueprint-compiler gtk4 libsoup ffmpeg gettext
      - name: Build binaries
        run: GETTEXT_DIR=/opt/homebrew cargo build --no-default-features -F gui,ffmpeg
      - name: Run tests
        run: GETTEXT_DIR=/opt/homebrew cargo test
      - name: Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

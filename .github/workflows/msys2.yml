name: MSYS2

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  msys2-ucrt64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-git mingw-w64-ucrt-x86_64-rust mingw-w64-ucrt-x86_64-blueprint-compiler mingw-w64-ucrt-x86_64-upx mingw-w64-ucrt-x86_64-7zip unzip grep mingw-w64-ucrt-x86_64-sed mingw-w64-ucrt-x86_64-gettext-runtime mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-libadwaita mingw-w64-ucrt-x86_64-adwaita-icon-theme mingw-w64-ucrt-x86_64-glib2 mingw-w64-ucrt-x86_64-gtk4 mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-dbus mingw-w64-ucrt-x86_64-openssl mingw-w64-ucrt-x86_64-libsoup3 mingw-w64-ucrt-x86_64-nsis

      - name: Run tests
        run: |
          cargo test

      - name: CI Build
        run: |
          ./packaging/windows/build_msys2.sh

      - uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist/SongRec-standalone.exe

      - name: NSIS Build
        run: |
          ./packaging/windows/build_nsis.sh

      - uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist/SongRec-installer.exe
